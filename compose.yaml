name: dsh-${RESEARCH_TARGET:?Set RESEARCH_TARGET in .env}

services:
  network-anchor:
    image: node:22-bookworm-slim
    command: [sleep, infinity]
    init: true
    ports:
      - 127.0.0.1:${DSH_PORT:-3080}:${DSH_PORT:-3080}
    restart: unless-stopped

  security-research:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        DSH_SOURCE_URL: ${DSH_SOURCE_URL:-https://github.com/n0pe-sled/deepseek-harness.git}
        DSH_SOURCE_REF: ${DSH_SOURCE_REF:-b150a551b8d465e31e418e1b2eaf5e79bbb7d28e}
        DSH_PLUGINS_SOURCE_URL: ${DSH_PLUGINS_SOURCE_URL:-https://github.com/n0pe-sled/deepseek-harness-plugins.git}
        DSH_PLUGINS_SOURCE_REF: ${DSH_PLUGINS_SOURCE_REF:-530b595efdf787c97474c4d7eee8ee8caa96d6f2}
        DSH_SKILLS_SOURCE_URL: ${DSH_SKILLS_SOURCE_URL:-https://github.com/n0pe-sled/deepseek-harness-skills.git}
        DSH_SKILLS_SOURCE_REF: ${DSH_SKILLS_SOURCE_REF:-a61a51a4af6d1e4868cc9b90625dc78701c0a160}
        GHIDRA_MCP_REF: ${GHIDRA_MCP_REF:-6f7e7e8988e1efde5dd23372df71fe05c115722e}
        JD_MCP_DUO_VERSION: ${JD_MCP_DUO_VERSION:-v4.2.5.4}
        JD_MCP_DUO_SHA256: ${JD_MCP_DUO_SHA256:-a68762013ca9375b72d7021a5732dba3743de67f7c25b1834f3579f00672ff3f}
        WIRESHARK_MCP_REF: ${WIRESHARK_MCP_REF:-2a8c009fb38723a9212e47d6156cc8a6b2f624c0}
    image: deepseek-security-research:local
    init: true
    working_dir: /workspace
    network_mode: service:network-anchor
    environment:
      DSH_HOME: /state/dsh
      DSH_AGENTS_HOME: /state/agents
      DSH_PORT: ${DSH_PORT:-3080}
      DSH_INTERNAL_PORT: 39080
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ENABLE_RTX_SPARK: ${ENABLE_RTX_SPARK:-0}
      RTX_SPARK_API_KEY: ${RTX_SPARK_API_KEY:-}
      RTX_SPARK_BASE_URL: ${RTX_SPARK_BASE_URL:-}
      RTX_SPARK_DISPLAY_NAME: ${RTX_SPARK_DISPLAY_NAME:-RTX-Spark}
      RTX_SPARK_MODEL_ID: ${RTX_SPARK_MODEL_ID:-deepseek-v4-flash-0731}
      RTX_SPARK_MODEL_NAME: ${RTX_SPARK_MODEL_NAME:-DeepSeek V4 Flash 0731}
      RTX_SPARK_CONTEXT_WINDOW: ${RTX_SPARK_CONTEXT_WINDOW:-1048576}
      RTX_SPARK_REASONING_EFFORT: ${RTX_SPARK_REASONING_EFFORT:-max}
      DSH_TRUSTED_HOST: ${DSH_TRUSTED_HOST:-}
      ENABLE_LUDUS_MCP: ${ENABLE_LUDUS_MCP:-0}
      LUDUS_URL: ${LUDUS_URL:-}
      LUDUS_API_KEY: ${LUDUS_API_KEY:-}
      DSH_LUDUS_MCP_SPEC: ${DSH_LUDUS_MCP_SPEC:-@badsectorlabs/ludus-mcp@0.2.0}
      LUDUS_RANGE_CONNECT: ${LUDUS_RANGE_CONNECT:-auto}
      LUDUS_WIREGUARD_CONFIG: ${LUDUS_WIREGUARD_CONFIG:-}
      LUDUS_SSH_USER: ${LUDUS_SSH_USER:-debian}
      LUDUS_SSH_PASSWORD: ${LUDUS_SSH_PASSWORD:-debian}
      LUDUS_SSH_KEY_PATH: ${LUDUS_SSH_KEY_PATH:-}
      LUDUS_KALI_SSH_USER: ${LUDUS_KALI_SSH_USER:-kali}
      LUDUS_KALI_SSH_PASSWORD: ${LUDUS_KALI_SSH_PASSWORD:-kali}
      LUDUS_WINDOWS_DOMAIN: ${LUDUS_WINDOWS_DOMAIN:-LUDUS}
      LUDUS_WINDOWS_USER: ${LUDUS_WINDOWS_USER:-}
      LUDUS_WINDOWS_PASSWORD: ${LUDUS_WINDOWS_PASSWORD:-}
      LUDUS_WINDOWS_LOCAL_USER: ${LUDUS_WINDOWS_LOCAL_USER:-localuser}
      LUDUS_WINDOWS_LOCAL_PASSWORD: ${LUDUS_WINDOWS_LOCAL_PASSWORD:-password}
      LUDUS_WINDOWS_DOMAIN_ADMIN: ${LUDUS_WINDOWS_DOMAIN_ADMIN:-domainadmin}
      LUDUS_WINDOWS_DOMAIN_ADMIN_PASSWORD: ${LUDUS_WINDOWS_DOMAIN_ADMIN_PASSWORD:-password}
      LUDUS_WINDOWS_DOMAIN_USER: ${LUDUS_WINDOWS_DOMAIN_USER:-domainuser}
      LUDUS_WINDOWS_DOMAIN_USER_PASSWORD: ${LUDUS_WINDOWS_DOMAIN_USER_PASSWORD:-password}
      ENABLE_JAVA_MCP: ${ENABLE_JAVA_MCP:-1}
      ENABLE_GHIDRA_MCP: ${ENABLE_GHIDRA_MCP:-1}
      GHIDRA_MCP_URL: http://127.0.0.1:8089/
      ENABLE_WIRESHARK_MCP: ${ENABLE_WIRESHARK_MCP:-1}
    volumes:
      - ${RESEARCH_WORK_ROOT:?Set RESEARCH_WORK_ROOT in .env}/${RESEARCH_TARGET}:/workspace
      - ${RESEARCH_WORK_ROOT:?Set RESEARCH_WORK_ROOT in .env}/.session-state/${RESEARCH_TARGET}/dsh:/state/dsh
      - ${RESEARCH_WORK_ROOT:?Set RESEARCH_WORK_ROOT in .env}/.session-state/${RESEARCH_TARGET}/agents:/state/agents
      - ${RESEARCH_WORK_ROOT:?Set RESEARCH_WORK_ROOT in .env}/.session-state/${RESEARCH_TARGET}/ludus-ssh:/run/ludus-ssh:ro
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      - network-anchor
      - ghidra-headless
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, -fsS, "http://127.0.0.1:${DSH_PORT:-3080}/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # The small stdio bridge runs in security-research; the actual parser,
  # analysis database, and Java/Ghidra runtime stay isolated here.
  ghidra-headless:
    build:
      context: .
      dockerfile: docker/Ghidra.Dockerfile
      additional_contexts:
        ghidra_source: "https://github.com/bethington/ghidra-mcp.git#${GHIDRA_MCP_REF:-6f7e7e8988e1efde5dd23372df71fe05c115722e}"
    image: ghidra-mcp-headless:${GHIDRA_MCP_REF:-6f7e7e8988e1efde5dd23372df71fe05c115722e}
    init: true
    network_mode: service:network-anchor
    depends_on:
      - network-anchor
    environment:
      GHIDRA_MCP_PORT: 8089
      GHIDRA_MCP_BIND_ADDRESS: 127.0.0.1
      GHIDRA_MCP_FILE_ROOT: /workspace
      GHIDRA_MCP_ALLOW_SCRIPTS: 0
      JAVA_OPTS: ${GHIDRA_JAVA_OPTS:--Xmx4g -XX:+UseG1GC}
    volumes:
      - ${RESEARCH_WORK_ROOT:?Set RESEARCH_WORK_ROOT in .env}/${RESEARCH_TARGET}:/workspace:ro
      - ${RESEARCH_WORK_ROOT:?Set RESEARCH_WORK_ROOT in .env}/.session-state/${RESEARCH_TARGET}/ghidra-data:/data
      - ${RESEARCH_WORK_ROOT:?Set RESEARCH_WORK_ROOT in .env}/.session-state/${RESEARCH_TARGET}/ghidra-projects:/projects
    restart: unless-stopped

  # Containerized headless Burp (phase 1, feature/burp-container). Shares the
  # loopback with DSH like ghidra-headless; reachable only there. Opt-in via
  # --profile burp. Full Compose/startup wiring (health gating, MCP overlay,
  # session preflight) is phase 4; this service is the runnable connectivity
  # slice plus the phase 1 proof.
  burp:
    profiles: [burp]
    build:
      context: .
      dockerfile: docker/Burp.Dockerfile
      args:
        BURP_VERSION: ${BURP_VERSION:-}
        BURP_SHA256: ${BURP_SHA256:-}
        BURP_DIST_URL: ${BURP_DIST_URL:-}
    image: deepseek-burp:${BURP_VERSION:-local}
    init: true
    network_mode: service:network-anchor
    depends_on:
      - network-anchor
      - burp-fixture
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /home/burp:size=64m,mode=0755
      - /run:size=16m,mode=1777
      - /tmp:size=256m,mode=1777
    environment:
      STATE_DIR: /state
      BURP_VERSION: ${BURP_VERSION:-}
      BURP_API_PORT: ${BURP_API_PORT:-1337}
      BURP_PROXY_PORT: ${BURP_PROXY_PORT:-8080}
      BURP_REST_USER: ${BURP_REST_USER:-}
      BURP_REST_PASSWORD: ${BURP_REST_PASSWORD:-}
      BURP_REQUIRE_LICENSE: ${BURP_REQUIRE_LICENSE:-0}
      BURP_LICENSE_KEY: ${BURP_LICENSE_KEY:-}
      BURP_TARGET_ALLOWLIST: ${BURP_TARGET_ALLOWLIST:-127.0.0.1:18000}
      BURP_REST_ARGS: ${BURP_REST_ARGS:-}
      FIXTURE_PORT: 18000
    volumes:
      - ${RESEARCH_WORK_ROOT:?Set RESEARCH_WORK_ROOT in .env}/${RESEARCH_TARGET}:/workspace:ro
      - ${RESEARCH_WORK_ROOT:?Set RESEARCH_WORK_ROOT in .env}/.session-state/${RESEARCH_TARGET}/burp:/state
      - ${RESEARCH_WORK_ROOT:?Set RESEARCH_WORK_ROOT in .env}/.session-state/${RESEARCH_TARGET}/burp/license:/run/license:ro
    restart: unless-stopped
    healthcheck:
      test: [CMD, /app/burp-health.sh]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  # Phase 1 proof fixture: a tiny static target bound to the shared loopback.
  # Exists so a proxied round-trip can be proven with no LAN exposure and no
  # outbound network.
  burp-fixture:
    profiles: [burp]
    image: node:22-bookworm-slim
    init: true
    network_mode: service:network-anchor
    depends_on:
      - network-anchor
    environment:
      FIXTURE_PORT: 18000
    command:
      - node
      - -e
      - >
        let n = 0;
        require('http').createServer((req, res) => {
          n += 1;
          res.setHeader('content-type', 'application/json');
          res.end(JSON.stringify({ service: 'burp-fixture', count: n, path: req.url, ts: Date.now() }));
        }).listen(process.env.FIXTURE_PORT || 18000, '127.0.0.1');
    restart: unless-stopped

