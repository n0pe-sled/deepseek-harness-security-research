# Java/JVM artifact analysis via the pinned jd-mcp-duo JAR bundled in DSH.
- insert:
    - id: security-mcp-java-bytecode
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: java_bytecode
        transport: stdio
        command: /opt/java/openjdk/bin/java
        args:
          - -Xss10m
          - -jar
          - /opt/jd-mcp-duo/jd-mcp-duo.jar
        env:
          JAVA_TOOL_OPTIONS: !!js >-
            '-Djd.mcp.sqlite.index=' + process.getBuiltinModule('node:path').join(process.cwd(), 'analysis', 'research', 'indexes', 'java.sqlite')
        cwd: !!js process.cwd()
        toolCallTimeoutMs: 180000
        failOnStartupError: true
